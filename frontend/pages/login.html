<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasktion — Login</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="auth-container">
        <h1>Tasktion</h1>
        <p>Assign tasks. Track progress. Stay organized.</p>

        <div class="tabs">
            <button class="tab-btn active" data-tab="login">Login</button>
            <button class="tab-btn" data-tab="register">Register</button>
            <button class="tab-btn" data-tab="admin">Admin</button>
        </div>

        <form id="login-form" class="auth-form active">
            <input type="email" id="login-email" placeholder="Email address" required autocomplete="email">
            <input type="password" id="login-password" placeholder="Password" required autocomplete="current-password">
            <button type="submit">Sign in</button>
            <p class="error" id="login-error"></p>
        </form>

        <form id="register-form" class="auth-form">
            <input type="email" id="register-email" placeholder="Email address" required autocomplete="email">
            <input type="password" id="register-password" placeholder="Create a password" required minlength="8" autocomplete="new-password">
            <button type="submit">Create account</button>
            <p class="error" id="register-error"></p>
        </form>

        <form id="admin-form" class="auth-form">
            <input type="email" id="admin-email" placeholder="Admin email address" required autocomplete="email">
            <input type="password" id="admin-password" placeholder="Create a password" required minlength="8" autocomplete="new-password">
            <input type="password" id="admin-secret" placeholder="Admin secret key" required autocomplete="off">
            <button type="submit">Register as admin</button>
            <p class="error" id="admin-error"></p>
        </form>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
