# Render's free plan sleeps when idle and Vercel stops the app between requests, so this schedule
# wakes the app every hour to send due-soon reminders. The 120s timeout covers Render's ~1 minute wake-up.
# Needs repository settings: secret CRON_SECRET (same value as on Render or Vercel) and variable APP_URL.
name: Send reminders

on:
  schedule:
    - cron: "17 * * * *"  # off the top of the hour, when GitHub's queue is busiest
  workflow_dispatch:

permissions: {}

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /cron/reminders
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Set the APP_URL variable and CRON_SECRET secret in the repository settings."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 120 \
            --retry 2 --retry-delay 20 --retry-all-errors \
            -X POST -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/cron/reminders"
